services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: movexa
      POSTGRES_PASSWORD: movexa_dev
      POSTGRES_DB: movexa
    ports:
      - "5432:5432"
    volumes:
      - movexa-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movexa -d movexa"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://movexa:movexa_dev@db:5432/movexa?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-this-before-deploying}
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  movexa-db:
